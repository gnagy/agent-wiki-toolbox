# This repo's own tools, declared here so a standalone clone builds the same as
# one sitting inside the AiSandbox workspace -- which deliberately declares none
# at its level for exactly that reason.
#
# bun installs the dependencies and runs the code: both binaries carry a `bun`
# shebang. node is still pinned because the test runner is `node --test` and
# because the Quartz plugins are imported by Quartz's own node process, which
# is what keeps the source plain node-compatible ESM rather than bun-specific.

[tools]
bun = "1.3.14"
node = "24.18.0"
